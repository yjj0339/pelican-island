<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鹈鹕单车">
<meta name="theme-color" content="#8fd3e8">

<body>
<title>鹈鹕单车</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Share+Tech+Mono&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed WebGL island; HUD pinned to the corners like stickers on a handlebar, cycling computer bottom-left */
:root{
  --ink:#20303a;          /* deep sea-ink outlines */
  --paper:#fff6e6;        /* sun-bleached sticker paper */
  --pouch:#f08a2c;        /* pelican pouch orange, the one accent */
  --pouch-deep:#c9611a;
  --lcd:#c3cdb0;          /* reflective monochrome LCD */
  --lcd-ink:#1d2618;
  --sky:#8fd3e8;
  --shade:rgba(32,48,58,.18);
  --font-display:"ZCOOL KuaiLe","Baloo 2","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-ui:"Baloo 2","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-lcd:"Share Tech Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);overflow:hidden;font-family:var(--font-ui);-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden}
body.rot #stage{inset:auto;top:0;left:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
.rotbtn{display:none}
@media (pointer:coarse) and (orientation:portrait){ .rotbtn{display:inline-block} }
html,body{overscroll-behavior:none}
.btn,.tbtn{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#app canvas:active{cursor:grabbing}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud > *{pointer-events:auto}
.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.brand h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(28px,4.4vw,46px);line-height:1;color:var(--paper);
  letter-spacing:.04em;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),3px 4px 0 var(--ink)}
.brand p{margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--ink);opacity:.75}
.tray{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:min(560px,62vw)}
.btn{font:700 14px/1 var(--font-ui);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;
  padding:8px 13px 6px;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap}
.btn:hover{background:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--pouch);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--pouch);color:var(--paper)}
.btn small{font-weight:500;opacity:.8;margin-left:4px}

/* cycling computer */
.computer{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  width:236px;background:#2b3236;border-radius:22px 22px 26px 26px;padding:10px 10px 12px;box-shadow:0 5px 0 var(--ink),0 10px 24px var(--shade);border:2px solid var(--ink)}
.computer .brandline{display:flex;justify-content:space-between;font:700 10px/1 var(--font-ui);letter-spacing:.2em;color:#9aa6a8;padding:0 6px 7px}
.lcd{background:linear-gradient(170deg,#ccd6b8,var(--lcd) 60%,#b5c0a1);border-radius:12px;padding:8px 10px 9px;color:var(--lcd-ink);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35);font-family:var(--font-lcd);font-variant-numeric:tabular-nums}
.lcd .big{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(29,38,24,.35);padding-bottom:3px}
.lcd .big b{font-size:50px;line-height:1;font-weight:400;letter-spacing:-.02em}
.lcd .big span{font-size:13px}
.lcd .ghost{position:relative}
.lcd .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:5px}
.lcd .cell{display:flex;align-items:baseline;justify-content:space-between;gap:4px;font-size:18px;line-height:1.15}
.lcd .cell label{font:700 10px/1 var(--font-ui);letter-spacing:.06em;opacity:.7}
.lcd .cell i{font-style:normal;font-size:10px;opacity:.7;margin-left:2px}
.lcd .bar{height:5px;margin-top:6px;background:rgba(29,38,24,.15);border-radius:3px;overflow:hidden}
.lcd .bar div{height:100%;width:0;background:var(--lcd-ink)}

/* fish counter */
.catch{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 82px);
  display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:6px 14px 4px 8px;box-shadow:0 3px 0 var(--ink)}
.catch svg{width:38px;height:22px;flex:none}
.catch b{font:800 26px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.catch span{font-size:12px;font-weight:700;opacity:.7;line-height:1.1}
.catch .combo{color:var(--pouch-deep);font-weight:800}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  font:800 18px/1.2 var(--font-ui);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:8px 16px 6px;
  box-shadow:0 3px 0 var(--ink);transition:opacity .25s,transform .25s;text-align:center;max-width:min(86vw,520px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

.keys{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  background:rgba(255,246,230,.9);border:2px solid var(--ink);border-radius:16px;padding:10px 14px 8px;box-shadow:0 3px 0 var(--ink);
  font-size:13px;line-height:1.55;max-width:300px}
.keys h2{margin:0 0 4px;font:400 18px/1.2 var(--font-display);letter-spacing:.04em}
.keys dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0}
.keys dt{font-family:var(--font-lcd);font-weight:700;white-space:nowrap}
.keys dd{margin:0}
.keys .tip{margin:6px 0 0;font-size:12px;opacity:.75}

/* touch pad (coarse pointers only) */
.touch{display:none}
.pad{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;align-items:flex-end}
.pad.left{left:max(16px,env(safe-area-inset-left,0px))}
.pad.right{right:max(16px,env(safe-area-inset-right,0px))}
.tbtn{width:62px;height:62px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,246,230,.88);box-shadow:0 3px 0 var(--ink);
  font:800 15px/1 var(--font-ui);color:var(--ink);touch-action:none;display:grid;place-items:center}
.tbtn.big{width:78px;height:78px;background:var(--pouch);color:var(--paper);font-size:17px}
.tbtn.on{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);filter:brightness(.92)}
.tcol{display:flex;flex-direction:column;gap:10px}

@media (pointer:coarse){
  .keys{display:none}
  .touch{display:block}
  .computer{left:50%;transform:translateX(-50%) scale(.82);transform-origin:bottom center;bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
}
@media (max-width:700px){
  .brand h1{font-size:26px}
  .brand p{display:none}
  .tray{flex-direction:column;align-items:flex-end;max-width:none;gap:6px}
  .btn{font-size:12px;padding:7px 10px 5px}
  .btn small{display:none}
  .catch{top:calc(env(safe-area-inset-top,0px) + 52px);padding:4px 10px 2px 6px;gap:8px}
  .catch svg{width:30px;height:18px}
  .catch b{font-size:20px}
  .catch span{font-size:11px}
}
@media (pointer:coarse) and (max-width:700px){
  .computer{left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 104px);bottom:auto;transform:scale(.62);transform-origin:top left}
  #btnHelp{display:none}
  #toast{top:calc(env(safe-area-inset-top,0px) + 240px);font-size:15px}
}
.hidden-ui .keys,.hidden-ui .tray .opt{display:none}
@media (prefers-reduced-motion:reduce){ .btn,#toast{transition:none} }
</style>

<div id="stage">
<div id="app" aria-label="三维场景：鹈鹕骑自行车环岛"></div>
<div class="hud" id="hud">
  <header class="brand">
    <h1>鹈鹕单车</h1>
    <p>PELECANUS · 鹈鹕湾环岛</p>
  </header>

  <div class="tray" role="toolbar" aria-label="设置">
    <button class="btn" id="btnAuto" aria-pressed="true">自动骑行<small>P</small></button>
    <button class="btn" id="btnCam">视角：追随<small>C</small></button>
    <button class="btn opt" id="btnTime">昼夜<small>T</small></button>
    <button class="btn rotbtn" id="btnRot" aria-pressed="false">横屏</button>
    <button class="btn" id="btnSound" aria-pressed="false">开启声音<small>M</small></button>
    <button class="btn opt" id="btnHelp" aria-pressed="true">按键<small>H</small></button>
  </div>

  <div class="catch" aria-live="polite">
    <svg viewBox="0 0 38 22" aria-hidden="true"><path d="M3 11c5-8 17-9 25-2l7-6v16l-7-6c-8 7-20 6-25-2z" fill="#7fb3c9" stroke="#20303a" stroke-width="2" stroke-linejoin="round"/><circle cx="10" cy="9.5" r="1.8" fill="#20303a"/></svg>
    <b id="vFish">0</b>
    <span>条鱼进了喉囊<br><em class="combo" id="vCombo">接住飘在路上的鱼</em></span>
  </div>

  <section class="computer" aria-label="自行车码表">
    <div class="brandline"><span>PELI·CYCLO</span><span id="vClock">10:00</span></div>
    <div class="lcd">
      <div class="big"><b id="vSpeed">00.0</b><span>km/h</span></div>
      <div class="grid">
        <div class="cell"><label>踏频</label><span><span id="vCad">0</span><i>rpm</i></span></div>
        <div class="cell"><label>齿比</label><span id="vGear">42×18</span></div>
        <div class="cell"><label>坡度</label><span><span id="vSlope">0.0</span><i>%</i></span></div>
        <div class="cell"><label>心率</label><span><span id="vHr">92</span><i>bpm</i></span></div>
        <div class="cell"><label>里程</label><span><span id="vDist">0.00</span><i>km</i></span></div>
        <div class="cell"><label>圈</label><span><span id="vLap">0</span> <i id="vLapT">0:00</i></span></div>
      </div>
      <div class="bar" title="体力"><div id="vStam"></div></div>
    </div>
  </section>

  <div id="toast" role="status"></div>

  <aside class="keys" id="keys">
    <h2>骑法</h2>
    <dl>
      <dt>W / ↑</dt><dd>蹬踏（Shift 站起冲刺）</dd>
      <dt>S / ↓</dt><dd>刹车</dd>
      <dt>A D / ← →</dt><dd>转向，车身会压弯</dd>
      <dt>空格</dt><dd>跳车；空中按住＝扑翼滑翔</dd>
      <dt>Q / E</dt><dd>换档</dd>
      <dt>B</dt><dd>按铃</dd>
      <dt>F</dt><dd>松开车把，挥翅膀</dd>
      <dt>拖动 / 滚轮</dt><dd>转动、缩放镜头</dd>
    </dl>
    <p class="tip">冲上木质跳台，空中的金鱼更值钱。</p>
  </aside>

  <div class="touch" aria-hidden="false">
    <div class="pad left">
      <button class="tbtn" data-k="left" aria-label="左转">左</button>
      <button class="tbtn" data-k="right" aria-label="右转">右</button>
    </div>
    <div class="pad right">
      <div class="tcol">
        <button class="tbtn" data-k="bell" aria-label="按铃">铃</button>
        <button class="tbtn" data-k="brake" aria-label="刹车">刹</button>
      </div>
      <div class="tcol">
        <button class="tbtn" data-k="jump" aria-label="跳">跳</button>
        <button class="tbtn big" data-k="pedal" aria-label="蹬踏">蹬</button>
      </div>
    </div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================= core: utils, renderer, heightfield, road, sky, sea ================= */
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth01 = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const angWrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
let seed = 7;
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V3(0, 1, 0);

const VIEW = () => { const s = document.getElementById('stage'); return s && s.clientWidth ? [s.clientWidth, s.clientHeight] : [innerWidth, innerHeight]; };
const appEl = $('#app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(...VIEW());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
appEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, VIEW()[0] / VIEW()[1], 0.08, 2600);
scene.fog = new THREE.Fog(0xbfe7f2, 120, 900);

/* ---------- geometry merge helper (keeps draw calls low) ---------- */
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = V3(), _p = V3(), _e = new THREE.Euler();
function mtx(px, py, pz, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) {
  _e.set(rx, ry, rz); _q.setFromEuler(_e); _p.set(px, py, pz); _s.set(sx, sy, sz);
  return new THREE.Matrix4().compose(_p, _q, _s);
}
function merge(parts) { // parts: [geo, matrix, hexColor]
  let n = 0;
  const gs = parts.map(([g, m, c]) => { const q = (g.index ? g.toNonIndexed() : g.clone()); q.applyMatrix4(m); n += q.attributes.position.count; return [q, new THREE.Color(c)]; });
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
  let o = 0;
  for (const [g, c] of gs) {
    const P = g.attributes.position.array, N = g.attributes.normal.array;
    pos.set(P, o * 3); nor.set(N, o * 3);
    for (let i = 0; i < g.attributes.position.count; i++) { col[(o + i) * 3] = c.r; col[(o + i) * 3 + 1] = c.g; col[(o + i) * 3 + 2] = c.b; }
    o += g.attributes.position.count; g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeBoundingSphere();
  return out;
}
const vcMat = (o = {}) => new THREE.MeshStandardMaterial(Object.assign({ vertexColors: true, roughness: 0.85, metalness: 0 }, o));
const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.75, metalness: 0 }, o));
function shadowy(o, cast = true, recv = true) { o.traverse(c => { if (c.isMesh) { c.castShadow = cast; c.receiveShadow = recv; } }); return o; }

/* ---------- the road: one closed loop around the island ---------- */
const ROAD = { N: 1200, x: [], z: [], tx: [], tz: [], s: [], len: 0, width: 7, grid: new Map(), cell: 16, h: [] };
function roadXZ(u) {
  const a = u * TAU;
  const R = 152 + 24 * Math.sin(3 * a + 0.4) + 11 * Math.sin(5 * a + 1.3) + 5 * Math.sin(8 * a + 2.1);
  return [Math.cos(a) * R, Math.sin(a) * R * 0.92];
}
(function buildRoad() {
  for (let i = 0; i < ROAD.N; i++) { const [x, z] = roadXZ(i / ROAD.N); ROAD.x.push(x); ROAD.z.push(z); }
  let acc = 0;
  for (let i = 0; i < ROAD.N; i++) {
    const j = (i + 1) % ROAD.N, k = (i - 1 + ROAD.N) % ROAD.N;
    const dx = ROAD.x[j] - ROAD.x[k], dz = ROAD.z[j] - ROAD.z[k], l = Math.hypot(dx, dz);
    ROAD.tx.push(dx / l); ROAD.tz.push(dz / l);
    ROAD.s.push(acc); acc += Math.hypot(ROAD.x[j] - ROAD.x[i], ROAD.z[j] - ROAD.z[i]);
    const key = Math.floor(ROAD.x[i] / ROAD.cell) + ',' + Math.floor(ROAD.z[i] / ROAD.cell);
    if (!ROAD.grid.has(key)) ROAD.grid.set(key, []);
    ROAD.grid.get(key).push(i);
  }
  ROAD.len = acc;
})();
function roadNearest(x, z) {
  const cx = Math.floor(x / ROAD.cell), cz = Math.floor(z / ROAD.cell);
  let best = 1e9, bi = -1;
  for (let r = 1; r <= 3 && bi < 0; r++) {
    for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) {
      const L = ROAD.grid.get((cx + a) + ',' + (cz + b)); if (!L) continue;
      for (const i of L) { const d = (ROAD.x[i] - x) ** 2 + (ROAD.z[i] - z) ** 2; if (d < best) { best = d; bi = i; } }
    }
  }
  if (bi < 0) return { d: 999, i: 0, side: 0 };
  const side = (x - ROAD.x[bi]) * -ROAD.tz[bi] + (z - ROAD.z[bi]) * ROAD.tx[bi];
  return { d: Math.sqrt(best), i: bi, side };
}

/* ---------- island heightfield (precomputed, bilinear sampled) ---------- */
const HF = { size: 680, res: 2, n: 0, h: null, road: null };
const shoreR = a => 262 + 14 * Math.sin(3 * a + 0.7) + 9 * Math.sin(7 * a + 2) + 5 * Math.sin(11 * a);
function rawHeight(x, z) {
  const r = Math.hypot(x, z), a = Math.atan2(z, x), sr = shoreR(a);
  const hills = Math.sin(x * 0.018 + 1) * Math.cos(z * 0.021) * 3.0 + Math.sin((x + z) * 0.037) * 1.3 + Math.cos(x * 0.061 - z * 0.047) * 0.45;
  const peak = 22 * Math.exp(-(x * x + z * z) / (2 * 58 * 58)) + 6 * Math.exp(-((x - 40) ** 2 + (z + 30) ** 2) / 900);
  const inland = 3.0 + hills + peak;
  const t = smooth01((sr - r) / 46);
  const sea = -0.6 - Math.min(9, Math.max(0, r - sr) * 0.14);
  return lerp(sea, inland, t);
}
(function buildHF() {
  const n = HF.size / HF.res + 1; HF.n = n;
  HF.h = new Float32Array(n * n); HF.road = new Float32Array(n * n);
  for (let i = 0; i < ROAD.N; i++) ROAD.h.push(rawHeight(ROAD.x[i], ROAD.z[i]));
  // smooth road profile so the climbs are bikeable

    const c = ROAD.h.slice();

  if (!ST.air && TMP.dustT < 0 && ((!ST.onRoad && ST.v > 2) || (ctl.brake && ST.v > 4))) {
    TMP.dustT = 0.05;
    const bx = ST.x - Math.sin(ST.yaw) * 0.55, bz = ST.z - Math.cos(ST.yaw) * 0.55;
    emit(KIND.dust, bx + rand(-0.15, 0.15), ST.y + 0.05, bz + rand(-0.15, 0.15), rand(-0.5, 0.5), rand(0.4, 1.2), rand(-0.5, 0.5), rand(0.6, 1.1), rand(0.35, 0.6), ST.onRoad ? 0x9a9a9a : 0xc9b48a);
  }
}

/* ---------- HUD ---------- */
function updateHUD(dt, t, clock) {
  TMP.hudT -= dt; if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }
  if (TMP.hudT > 0) return; TMP.hudT = 0.1;
  const kmh = ST.v * 3.6; UI.speed.textContent = (kmh < 10 ? '0' : '') + kmh.toFixed(1);
  UI.cad.textContent = Math.round(ST.cad); UI.gear.textContent = `${GEARS[ST.gear][0]}×${GEARS[ST.gear][1]}`;
  UI.slope.textContent = (ST.slope * 100).toFixed(1); UI.hr.textContent = Math.round(ST.hr);
  UI.dist.textContent = (ST.dist / 1000).toFixed(2); UI.lap.textContent = Math.max(0, ST.laps - 1);
  UI.lapT.textContent = ST.laps > 0 ? fmtT(t - ST.lapStart) : '–:––'; UI.stam.style.width = (ST.stamina * 100).toFixed(0) + '%';
  UI.clock.textContent = clock;
}

/* ---------- frame ---------- */
let lastT = performance.now(), T = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now; T += dt;
  const n = Math.max(1, Math.ceil(dt / 0.0125)); let ctl;
  for (let i = 0; i < n; i++) ctl = stepBike(dt / n, T);
  updateBike(dt, T, ctl);
  updateFish(dt, T); updateJumpers(dt); updateParticles(dt, T); updateAmbient(dt, T);
  const clock = updateSky(dt, T);
  updateCamera(dt, T);
  AUD.update(dt, T);
  updateHUD(dt, T, clock);
  renderer.render(scene, camera);
}
/* ---------- layout: phones held upright can rotate the whole game into landscape ---------- */
let ROT = false;
try { ROT = localStorage.getItem('peliRot') === '1'; } catch (e) {}
function layout() {
  const on = ROT && innerHeight > innerWidth, st = $('#stage');
  document.body.classList.toggle('rot', on);
  if (on) { st.style.width = innerHeight + 'px'; st.style.height = innerWidth + 'px'; } else { st.style.width = st.style.height = ''; }
  const [w, h] = VIEW(); renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  UI.bRot.setAttribute('aria-pressed', String(ROT));
}
UI.bRot.onclick = () => {
  ROT = !ROT; try { localStorage.setItem('peliRot', ROT ? '1' : '0'); } catch (e) {}
  layout(); toast(ROT ? '已切到横屏：把手机逆时针横过来（听筒朝左）' : '已恢复竖屏', 2.6);
};
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 250));
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
layout();
if (matchMedia('(pointer:coarse)').matches && innerHeight > innerWidth && !ROT) setTimeout(() => toast('横过手机玩视野更大，或点右上角「横屏」', 3.5), 1200);

/* ---------- keep the ride going across live updates ---------- */
function start(data) {
  if (data && data.st) { Object.assign(ST, data.st); SCORE.n = data.score || 0; CAM.mode = data.cam || 0; UI.bCam.firstChild.textContent = `视角：${CAM_MODES[CAM.mode]}`; ACTIONS.syncAuto(); ACTIONS.hud(); BASKET_FISH.forEach((m, k) => m.visible = k < Math.min(9, Math.ceil(SCORE.n / 3))); }
  window.claude?.hot?.snapshot?.(() => ({ st: { x: ST.x, z: ST.z, y: ST.y, yaw: ST.yaw, v: ST.v, tod: ST.tod, dist: ST.dist, auto: ST.auto, gear: ST.gear }, score: SCORE.n, cam: CAM.mode }));
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
